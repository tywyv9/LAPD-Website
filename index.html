<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Editor</title>
  
  <!-- Font Awesome for lock/unlock icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* Status Header Styles */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: #f8f9fa;
      border: 1px solid #e9ecef;
      border-radius: 6px;
      margin-bottom: 20px;
      font-family: system-ui, -apple-system, sans-serif;
    }

    #roleBadge {
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 0.85rem;
    }

    #roleBadge.locked {
      background-color: #ffe6e6;
      color: #cc0000;
    }

    #roleBadge.unlocked {
      background-color: #e6ffe6;
      color: #008000;
    }

    /* Content Visibility & Editing Controls */
    .edit-protected {
      padding: 10px;
      border-radius: 4px;
      transition: border 0.2s ease;
    }

    /* LOCKED STATE (Default) */
    body.locked .edit-protected {
      border: 1px solid transparent;
      outline: none;
    }

    body.locked .edit-only {
      display: none !important;
    }

    /* UNLOCKED STATE */
    body.unlocked .edit-protected {
      border: 1px dashed #4A90E2;
      background-color: #ffffff;
    }

    body.unlocked .edit-only {
      display: block;
    }
  </style>
</head>

<!-- Body defaults to 'locked' to prevent initial flicker -->
<body class="locked">

  <!-- Editor Control Header -->
  <div class="status-bar">
    <i id="editorIcon" class="fa-solid fa-lock" style="color: #ff6666;"></i>
    <span id="editorLabel">Editor Locked</span>
    <span id="roleBadge" class="locked">Locked</span>
  </div>

  <!-- Document Body Content -->
  <main>
    <!-- Content protected from editing when locked -->
    <div class="edit-protected">
      <h2>Document Header</h2>
      <p>This content is locked by default when the page loads.</p>
    </div>

    <!-- Content only visible when unlocked -->
    <div class="edit-only">
      <p style="color: #4A90E2;"><strong>[Admin Tooling]:</strong> You are currently editing this page.</p>
    </div>
  </main>

  <!-- Lock Initialization & Control Script -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Force page into locked state on startup
      setLockState(true);
    });

    function setLockState(isLocked) {
      const body = document.body;
      const editorLabel = document.getElementById('editorLabel');
      const roleBadge = document.getElementById('roleBadge');
      const editorIcon = document.getElementById('editorIcon');

      if (isLocked) {
        // 1. Update body state
        body.classList.remove('unlocked');
        body.classList.add('locked');

        // 2. Disable editing on all protected elements
        document.querySelectorAll('.edit-protected').forEach(el => {
          el.setAttribute('contenteditable', 'false');
        });

        // 3. Clear persistent unlocked state
        localStorage.setItem('editorUnlocked', 'false');

        // 4. Update Header UI
        if (editorLabel) editorLabel.textContent = 'Editor Locked';
        if (roleBadge) {
          roleBadge.textContent = 'Locked';
          roleBadge.className = 'locked';
        }
        if (editorIcon) {
          editorIcon.className = 'fa-solid fa-lock';
          editorIcon.style.color = '#ff6666';
        }
      } else {
        // Unlock logic
        body.classList.remove('locked');
        body.classList.add('unlocked');

        document.querySelectorAll('.edit-protected').forEach(el => {
          el.setAttribute('contenteditable', 'true');
        });

        localStorage.setItem('editorUnlocked', 'true');

        if (editorLabel) editorLabel.textContent = 'Editor Unlocked';
        if (roleBadge) {
          roleBadge.textContent = 'Unlocked';
          roleBadge.className = 'unlocked';
        }
        if (editorIcon) {
          editorIcon.className = 'fa-solid fa-unlock';
          editorIcon.style.color = '#28a745';
        }
      }
    }
  </script>
</body>
</html>
